[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbase-toolkit"
version = "0.1.0"
description = "Provider-native AI development workflows with safe local coordination"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "AgentBase contributors"}]
keywords = ["codex", "claude-code", "agents", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
# Yalnızca geliştirme içindir; çalışma zamanı bağımlılığı sıfır kalmalı.
dev = ["ruff>=0.6", "pytest>=8"]
yaml = ["PyYAML>=6.0.2,<7"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Mevcut kod tabanı uzun satırlı yazılmış; satır uzunluğu için ayrı bir temizlik işi açılmadan zorlanmaz.
ignore = ["E501"]

[project.urls]
Repository = "https://github.com/enestsc/AgentBase"
Issues = "https://github.com/enestsc/AgentBase/issues"

[project.scripts]
agentbase = "agentbase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentbase = ["assets/*.md", "assets/*.json", "assets/*.cjs", "assets/skills/*/*.md"]
