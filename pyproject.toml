[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbase-toolkit"
version = "0.1.0"
description = "Provider-native AI development workflows with safe local coordination"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "AgentBase contributors"}]
keywords = ["codex", "claude-code", "agents", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Repository = "https://github.com/enestsc/AgentBase"
Issues = "https://github.com/enestsc/AgentBase/issues"

[project.scripts]
agentbase = "agentbase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentbase = ["assets/*.md", "assets/*.json", "assets/skills/*/*.md"]
